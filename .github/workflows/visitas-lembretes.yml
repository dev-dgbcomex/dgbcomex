name: visitas-lembretes-email

on:
  schedule:
    - cron: "55 16 * * *"   # 13:55 Brasília (UTC-3) -> lembrete dia anterior (14h)
    - cron: "30 10 * * *"   # 7:30 Brasília (UTC-3) -> lembrete dia da visita
  workflow_dispatch:
    inputs:
      tipo:
        description: 'tipo de lembrete: "dia-anterior" ou "dia-da-visita"'
        required: true
        default: "dia-da-visita"

jobs:
  enviar-lembretes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Enviar lembretes de visita
        run: |
          TIPO="${{ github.event.inputs.tipo || 'dia-da-visita' }}"
          echo "Processando lembretes: $TIPO"
          curl -fsS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://dgbcomex.vercel.app/api/crm/visitas/lembretes?tipo=$TIPO"
